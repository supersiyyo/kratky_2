<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ day }} · Kratky monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <header>
    <div><p class="eyebrow">Completed timelapse</p><h1>{{ day }}</h1></div>
    <div class="header-actions">
      <a class="button" href="{{ url_for('recordings') }}">All timelapses</a>
      <a class="button primary" href="{{ url_for('index') }}">Live dashboard</a>
    </div>
  </header>
  <main>
    <section class="panel archive-panel">
      <div class="timelapse-preview viewer-timelapse">
        <div class="card-heading">
          <div>
            <h2>Water and environment</h2>
            <p>The combined daily video includes recorded time and matching sensor readings.</p>
          </div>
          <a class="button primary" download href="{{ url_for('recording_day_timelapse', day=day) }}">Download timelapse</a>
        </div>
        <video controls preload="metadata" src="{{ url_for('recording_day_timelapse', day=day) }}"></video>
        <small>{{ timelapse.filename }} · {{ (timelapse.size / 1048576)|round(1) }} MiB</small>
      </div>
    </section>
  </main>
</body>
</html>
